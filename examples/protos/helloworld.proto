syntax = "proto3";

option java_multiple_files = true;
option java_package = "io.grpc.examples.helloworld";
option java_outer_classname = "HelloWorldProto";
option objc_class_prefix = "HLW";

package helloworld;

// The greeting service definition.
service Greeter {
  // Sends a greeting
  //  unary rpc: client sends a single request to the server and gets a single response back
  rpc SayHello (HelloRequest) returns (HelloReply) {}

  // Sends another greeting
  rpc SayHelloAgain (HelloRequest) returns (HelloReply) {}

  // server stream rpc: client sends a request to the server and gets a stream to read a sequence of messages back.
  rpc SayHelloStreamReply (HelloRequest) returns (stream HelloReply) {}

  // client streaming rpc: client has finished writing the messages, it waits for the server to read them and return its response
  // rpc LotsOfGreetings(stream HelloRequest) returns (HelloResponse);

  // bidirectional rpc: both sides send a sequence of messages using a read-write stream. 
  // The two streams operate independently, so clients and servers can read and write in whatever 
  // order they like: for example, the server could wait to receive all the client messages before 
  // writing its responses, or it could alternately read a message then write a message, 
  // or some other combination of reads and writes. The order of messages in each stream is preserved.
  rpc SayHelloBidiStream (stream HelloRequest) returns (stream HelloReply) {}

}

// The request message containing the user's name.
message HelloRequest {
  string name = 1;
}

// The response message containing the greetings
message HelloReply {
  string message = 1;
}
